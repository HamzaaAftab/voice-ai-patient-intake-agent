services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_agent_patient_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount SQLite database file for local persistence across container recreations
      - ./patients.db:/app/patients.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
